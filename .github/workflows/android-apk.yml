name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      - name: Expo Doctor
        shell: bash
        run: |
          set -o pipefail
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            LOG="$(mktemp)"
            echo "Expo Doctor attempt ${attempt}/${MAX_ATTEMPTS}"
            if npx expo-doctor 2>&1 | tee "$LOG"; then
              rm -f "$LOG"
              exit 0
            fi

            if ! grep -Eqi 'ECONNRESET|fetch failed|requires a connection to the Expo API|ETIMEDOUT|EAI_AGAIN' "$LOG"; then
              echo "Expo Doctor reported a project/configuration failure; not retrying."
              rm -f "$LOG"
              exit 1
            fi

            rm -f "$LOG"
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Transient Expo API/network failure detected; retrying after $((attempt * 5)) seconds."
              sleep $((attempt * 5))
            fi
          done

          echo "Expo Doctor could not complete after ${MAX_ATTEMPTS} transient-network attempts."
          exit 1

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build arm64 release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --stacktrace

      - name: Verify and prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"

          PACKAGE="$(node -p "require('./app.json').expo.android.package")"
          VERSION_NAME="$(node -p "require('./app.json').expo.version")"
          VERSION_CODE="$(node -p "require('./app.json').expo.android.versionCode")"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"

          test -n "$AAPT"
          test -x "$AAPT"

          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='$PACKAGE'" >/dev/null
          printf '%s\n' "$BADGING" | grep -F "versionName='$VERSION_NAME'" >/dev/null
          printf '%s\n' "$BADGING" | grep -F "versionCode='$VERSION_CODE'" >/dev/null

          ABI_LIST="$(unzip -Z1 "$APK" | grep '^lib/' || true)"
          printf '%s\n' "$ABI_LIST" | grep '^lib/arm64-v8a/' >/dev/null
          if printf '%s\n' "$ABI_LIST" | grep -Eq '^lib/(x86|x86_64|armeabi-v7a)/'; then
            echo "Unexpected non-arm64 native libraries found in the arm64 release APK." >&2
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/RAID-Browser-arm64.apk

          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          {
            echo "RAID Browser Android APK"
            echo "package=$PACKAGE"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "sha256=$SHA"
            echo "size_bytes=$SIZE"
            echo "expected_abi=arm64-v8a"
            echo "commit=${GITHUB_SHA}"
            echo
            printf '%s\n' "$BADGING"
            echo
            printf '%s\n' "$ABI_LIST"
          } > release/APKANALYZER.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAID-BROWSER-APK
          path: |
            release/RAID-Browser-arm64.apk
            release/APKANALYZER.txt
          if-no-files-found: error
          retention-days: 30
