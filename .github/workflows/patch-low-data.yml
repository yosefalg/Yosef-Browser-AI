name: Patch low-data adaptive browsing

on:
  push:
    branches:
      - feat/2.14.53-low-data-adaptive

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/2.14.53-low-data-adaptive
          fetch-depth: 0

      - name: Apply low-data adaptive patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('app/browser.tsx')
          text = path.read_text()

          old_import = "import { DEFAULT_PERFORMANCE_SETTINGS, deriveBrowserPerformancePolicy, getPerformanceSettings, type PerformanceSettings } from '@/lib/performance';"
          new_import = "import { DEFAULT_PERFORMANCE_SETTINGS, deriveBrowserPerformancePolicy, getPerformanceSettings, policySummary, profileLabel, type PerformanceSettings } from '@/lib/performance';"
          if old_import not in text:
              raise SystemExit('performance import hook not found')
          text = text.replace(old_import, new_import, 1)

          old_derived = "  const playerHtml = useMemo(() => mediaUrl ? mediaPlayerHtml(mediaUrl) : '', [mediaUrl]);\n  const hasCustomSitePrefs = sitePrefs.desktopMode || !sitePrefs.thirdPartyCookies || !sitePrefs.autoplayMedia;"
          new_derived = "  const playerHtml = useMemo(() => mediaUrl ? mediaPlayerHtml(mediaUrl) : '', [mediaUrl]);\n  const activePolicy = useMemo(() => deriveBrowserPerformancePolicy(performanceSettings, loadedUrl || url), [performanceSettings, loadedUrl, url]);\n  const webSource = useMemo(() => {\n    const lowDataHeaders = activePolicy.profile === 'low-data' ? { 'Save-Data': 'on' } : undefined;\n    return lowDataHeaders ? { uri: url, headers: lowDataHeaders } : { uri: url };\n  }, [activePolicy.profile, url]);\n  const adaptiveHint = activePolicy.profile === 'balanced' ? '' : `${profileLabel(activePolicy.profile)} • ${policySummary(activePolicy)}`;\n  const hasCustomSitePrefs = sitePrefs.desktopMode || !sitePrefs.thirdPartyCookies || !sitePrefs.autoplayMedia;"
          if old_derived not in text:
              raise SystemExit('derived hook not found')
          text = text.replace(old_derived, new_derived, 1)

          old_source = "          source={{ uri: url }}\n          style={styles.web}\n          javaScriptEnabled"
          new_source = "          source={webSource}\n          style={styles.web}\n          javaScriptEnabled"
          if old_source not in text:
              raise SystemExit('webview source hook not found')
          text = text.replace(old_source, new_source, 1)

          old_cache = "          cacheEnabled={!privateMode}\n          incognito={privateMode}"
          new_cache = "          cacheEnabled={!privateMode}\n          cacheMode={activePolicy.preferCache ? 'LOAD_CACHE_ELSE_NETWORK' : 'LOAD_DEFAULT'}\n          incognito={privateMode}"
          if old_cache not in text:
              raise SystemExit('cache hook not found')
          text = text.replace(old_cache, new_cache, 1)

          old_hint = "      {!!rendererNotice && <View style={styles.rendererNotice} accessibilityRole=\"alert\"><Text style={styles.rendererNoticeText}>{rendererNotice}</Text></View>}\n      {loading && <View style={styles.progressTrack}"
          new_hint = "      {!!rendererNotice && <View style={styles.rendererNotice} accessibilityRole=\"alert\"><Text style={styles.rendererNoticeText}>{rendererNotice}</Text></View>}\n      {!!adaptiveHint && <View style={[styles.adaptiveHint, activePolicy.profile === 'low-data' && styles.adaptiveHintLowData, activePolicy.profile === 'video' && styles.adaptiveHintVideo, activePolicy.profile === 'downloads' && styles.adaptiveHintDownloads]}><Ionicons name={activePolicy.profile === 'video' ? 'play-circle-outline' : activePolicy.profile === 'downloads' ? 'download-outline' : activePolicy.profile === 'reading' ? 'reader-outline' : activePolicy.profile === 'low-data' ? 'leaf-outline' : 'flash-outline'} size={13} color=\"#F8F3EE\" /><Text numberOfLines={1} style={styles.adaptiveHintText}>{adaptiveHint}</Text></View>}\n      {loading && <View style={styles.progressTrack}"
          if old_hint not in text:
              raise SystemExit('adaptive hint hook not found')
          text = text.replace(old_hint, new_hint, 1)

          old_styles = "  private:{paddingVertical:6,paddingHorizontal:12,backgroundColor:'#3A302E'},privateText:{color:'#E7C9B6',fontSize:11,textAlign:'center',fontWeight:'700'},rendererNotice:{paddingVertical:7,paddingHorizontal:12,backgroundColor:'#343735',borderBottomWidth:1,borderBottomColor:'#555A55'},rendererNoticeText:{color:'#E7DED5',fontSize:11,textAlign:'center',fontWeight:'800'},"
          new_styles = "  private:{paddingVertical:6,paddingHorizontal:12,backgroundColor:'#3A302E'},privateText:{color:'#E7C9B6',fontSize:11,textAlign:'center',fontWeight:'700'},rendererNotice:{paddingVertical:7,paddingHorizontal:12,backgroundColor:'#343735',borderBottomWidth:1,borderBottomColor:'#555A55'},rendererNoticeText:{color:'#E7DED5',fontSize:11,textAlign:'center',fontWeight:'800'},adaptiveHint:{minHeight:28,flexDirection:'row',alignItems:'center',gap:7,paddingHorizontal:11,backgroundColor:'#353935',borderBottomWidth:1,borderBottomColor:'#4B4F4B'},adaptiveHintLowData:{backgroundColor:'#2F4135'},adaptiveHintVideo:{backgroundColor:'#2D3547'},adaptiveHintDownloads:{backgroundColor:'#3E352D'},adaptiveHintText:{flex:1,color:'#F8F3EE',fontSize:10,fontWeight:'800'},"
          if old_styles not in text:
              raise SystemExit('style hook not found')
          text = text.replace(old_styles, new_styles, 1)

          path.write_text(text)

          app = Path('app.json')
          data = json.loads(app.read_text())
          data['expo']['version'] = '2.14.53'
          data['expo']['android']['versionCode'] = 139
          app.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

          git diff --check
          grep -F "Save-Data': 'on'" app/browser.tsx
          grep -F "LOAD_CACHE_ELSE_NETWORK" app/browser.tsx
          grep -F '"version": "2.14.53"' app.json
          grep -F '"versionCode": 139' app.json

          git config user.name "RAID Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/browser.tsx app.json
          git rm .github/workflows/patch-low-data.yml
          git commit -m "feat(browser): adaptive low-data request and cache hints"
          git push origin HEAD:feat/2.14.53-low-data-adaptive
