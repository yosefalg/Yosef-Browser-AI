name: Patch RAID media player

on:
  push:
    branches:
      - "fix/2.14.51-media-player-responsive"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/2.14.51-media-player-responsive
          fetch-depth: 0

      - name: Apply media patch
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .media-player-patched ]; then
            echo "already patched"
            exit 0
          fi
          python scripts/patch_media_player.py
          git diff --check
          grep -F '"version": "2.14.51"' app.json
          grep -F '"versionCode": 137' app.json
          grep -F 'RAID_MEDIA_CLOSE' app/browser.tsx
          git config user.name "RAID Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/browser.tsx app.json .media-player-patched
          git commit -m "fix(media): responsive usable player [media-patched]"
          git push origin HEAD:fix/2.14.51-media-player-responsive
