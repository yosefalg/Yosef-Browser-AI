name: RAID Web Streaming Patch

on:
  push:
    paths:
      - '.github/workflows/raid-web-stream-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch browser web streaming behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/browser.tsx')
          s = p.read_text(encoding='utf-8')

          old = "const DIRECT_MEDIA_RE = /\\.(?:mp4|m4v|webm|m3u8)(?:$|[?#])/i;"
          new = old + "\nconst STREAM_PAGE_RE = /\\/s\\/[A-Za-z0-9_-]{6,}(?:$|[/?#])/i;"
          assert old in s, 'DIRECT_MEDIA_RE anchor missing'
          s = s.replace(old, new, 1)

          old = "function isDirectMediaUrl(value: string) {\n  return /^https?:\\/\\//i.test(value) && DIRECT_MEDIA_RE.test(value);\n}"
          new = old + "\n\nfunction isLikelyStreamPage(value: string) {\n  try {\n    const parsed = new URL(value);\n    return /^https?:$/i.test(parsed.protocol) && STREAM_PAGE_RE.test(parsed.pathname + parsed.search + parsed.hash);\n  } catch { return false; }\n}"
          assert old in s, 'isDirectMediaUrl anchor missing'
          s = s.replace(old, new, 1)

          old = "  const scanMedia = () => web.current?.injectJavaScript(MEDIA_SCAN_JS);"
          new = old + "\n\n  const openInlineMedia = (candidate: string) => {\n    if (!/^https?:\\/\\//i.test(candidate)) return;\n    setMediaUrl(candidate);\n    setMediaUrls((current) => current.includes(candidate) ? current : [candidate, ...current].slice(0, 12));\n    setMediaOpen(true);\n  };"
          assert old in s, 'scanMedia anchor missing'
          s = s.replace(old, new, 1)

          old = "          onLoadEnd={() => { setLoading(false); setLoadProgress(1); captureContext(); scanMedia(); }}"
          new = "          onLoadEnd={(event) => {\n            setLoading(false);\n            setLoadProgress(1);\n            captureContext();\n            scanMedia();\n            if (isLikelyStreamPage(event.nativeEvent.url)) {\n              setTimeout(() => web.current?.injectJavaScript(PLAY_PAGE_VIDEO_JS), 450);\n              setTimeout(() => web.current?.injectJavaScript(MEDIA_SCAN_JS), 1200);\n            }\n          }}"
          assert old in s, 'onLoadEnd anchor missing'
          s = s.replace(old, new, 1)

          old = "          onShouldStartLoadWithRequest={(request) => shouldLoad(request.url)}\n          onMessage={onMessage}"
          new = "          onShouldStartLoadWithRequest={(request) => shouldLoad(request.url)}\n          onFileDownload={(event) => {\n            const downloadUrl = event.nativeEvent.downloadUrl;\n            if (/^https?:\\/\\//i.test(downloadUrl || '')) openInlineMedia(downloadUrl);\n          }}\n          onMessage={onMessage}"
          assert old in s, 'WebView callback anchor missing'
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify TypeScript anchors
        run: |
          grep -q "STREAM_PAGE_RE" app/browser.tsx
          grep -q "onFileDownload" app/browser.tsx
          grep -q "isLikelyStreamPage" app/browser.tsx

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/raid-web-stream-patch.yml
          git config user.name "RAID Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/browser.tsx .github/workflows/raid-web-stream-patch.yml
          git commit -m "feat: keep streaming links inside RAID browser"
          git push origin HEAD:main
