name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      - name: Expo Doctor
        shell: bash
        run: |
          set -o pipefail
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            LOG="$(mktemp)"
            echo "Expo Doctor attempt ${attempt}/${MAX_ATTEMPTS}"
            if npx expo-doctor 2>&1 | tee "$LOG"; then
              rm -f "$LOG"
              exit 0
            fi

            if ! grep -Eqi 'ECONNRESET|fetch failed|requires a connection to the Expo API|ETIMEDOUT|EAI_AGAIN' "$LOG"; then
              echo "Expo Doctor reported a project/configuration failure; not retrying."
              rm -f "$LOG"
              exit 1
            fi

            rm -f "$LOG"
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Transient Expo API/network failure detected; retrying after $((attempt * 5)) seconds."
              sleep $((attempt * 5))
            fi
          done

          echo "Expo Doctor could not complete after ${MAX_ATTEMPTS} transient-network attempts."
          exit 1

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build arm64 release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --stacktrace

      - name: Prepare artifact report
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          mkdir -p release
          cp "$APK" release/RAID-Browser-arm64.apk
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(stat -c%s "$APK")
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          {
            echo "RAID Browser Android APK"
            echo "sha256=$SHA"
            echo "size_bytes=$SIZE"
            echo "expected_abi=arm64-v8a"
            echo "commit=${GITHUB_SHA}"
            echo
            "$AAPT" dump badging "$APK" || true
          } > release/APKANALYZER.txt
          if command -v unzip >/dev/null; then
            unzip -l "$APK" | grep -E 'lib/arm64-v8a|lib/x86|lib/armeabi' >> release/APKANALYZER.txt || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAID-BROWSER-APK
          path: |
            release/RAID-Browser-arm64.apk
            release/APKANALYZER.txt
          if-no-files-found: error
          retention-days: 30
